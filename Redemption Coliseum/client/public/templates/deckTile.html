<link rel="stylesheet" href="templates/deckTile.css">
<div class="deck-tile">
  <!-- 1. Header -->
  <div class="deck-tile-header">
    <span class="deck-tile-title"></span>
    <button class="deck-tile-edit-btn" title="Rename Deck">🖉</button>
  </div>

  <!-- 2. Banner Medallion (Center) -->
  <div class="deck-tile-banner">
    <div class="deck-tile-medallion"></div>
    <div class="deck-tile-banner-actions">
      <button class="deck-banner-action-btn deck-tile-metrics-btn" title="Deck Metrics">📊</button>
      <button class="deck-banner-action-btn deck-tile-champs-btn" title="Select Champions">👑</button>
    </div>
  </div>

  <!-- 3. Footer -->
    <div class="deck-tile-info-row">
      <div class="deck-tile-brigades"></div>
      <span class="deck-tile-format"></span>
      <div class="deck-tile-validity"></div>
    </div>
    <div class="deck-tile-stats">
      <span class="deck-tile-stats-text"></span>
      <button class="deck-tile-stats-edit-btn" title="Edit Stats">🖉</button>
    </div>
    <div class="deck-tile-btn-group">
      <button class="deck-action-btn smith">⚒️ Deck Smith</button>
      <button class="deck-action-btn battle">⚔️ Battle</button>
    </div>
  </div>
</div>
